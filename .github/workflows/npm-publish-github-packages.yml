# Automatically builds the MengiTex Android APK and attaches it to GitHub Releases

name: MengiTex Android APK Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare signing keystore & environment
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || true
            fi
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build MengiTex APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare versioned APK artifact
        run: |
          mkdir -p release_apks
          TAG_NAME="${GITHUB_REF_NAME:-v2.0.0}"
          SAFE_TAG=$(echo "$TAG_NAME" | tr -cd 'A-Za-z0-9._-')
          APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "No APK found in app/build/outputs/apk/debug"
            exit 1
          fi
          cp "$APK_SRC" "release_apks/MengiTex-${SAFE_TAG}.apk"
          ls -lh release_apks/

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MengiTex-APK
          path: release_apks/*.apk

      - name: Publish APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release_apks/*.apk
          fail_on_unmatched_files: true
