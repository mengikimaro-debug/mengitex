# Automatically builds the MengiTex Android APK and attaches it to GitHub Releases

name: MengiTex Android APK Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v3.3.0)'
        required: true
        default: 'v3.3.0'
      version_code:
        description: 'Optional monotonic Android versionCode override'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & Install API 36.1
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Accept Android SDK licenses & verify platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36.1" "platform-tools" "build-tools;36.0.0" || true
          sdkmanager --install "build-tools;36.1.0" || true

      - name: Prepare valid signing keystore & environment
        run: |
          if [ -f debug.keystore.base64 ]; then
            rm -f debug.keystore
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || true
          fi
          if ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build MengiTex APK
        run: |
          TAG_NAME="${{ github.event.inputs.release_tag || github.ref_name || 'v3.3.0' }}"
          CLEAN_VER=$(echo "$TAG_NAME" | sed 's/^[vV]//' | tr -cd 'A-Za-z0-9._+-')
          EXTRA_ARGS=""
          if [ -n "$CLEAN_VER" ]; then
            EXTRA_ARGS="$EXTRA_ARGS -PAPP_VERSION_NAME=$CLEAN_VER"
          fi
          INPUT_CODE="${{ github.event.inputs.version_code }}"
          if [ -n "$INPUT_CODE" ]; then
            EXTRA_ARGS="$EXTRA_ARGS -PAPP_VERSION_CODE=$INPUT_CODE"
          fi
          gradle assembleDebug $EXTRA_ARGS \
            --no-daemon \
            --no-configuration-cache \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4500m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            --console=plain

      - name: Prepare versioned APK artifact
        run: |
          mkdir -p release_apks
          TAG_NAME="${{ github.event.inputs.release_tag || github.ref_name || 'v3.3.0' }}"
          SAFE_TAG=$(echo "$TAG_NAME" | tr -cd 'A-Za-z0-9._-')
          APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "No APK found in app/build/outputs/apk/debug"
            exit 1
          fi
          cp "$APK_SRC" "release_apks/MengiTex-${SAFE_TAG}.apk"
          ls -lh release_apks/

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MengiTex-APK
          path: release_apks/*.apk

      - name: Publish APK to GitHub Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: MengiTex ${{ github.event.inputs.release_tag || github.ref_name }}
          files: release_apks/*.apk
          fail_on_unmatched_files: true
