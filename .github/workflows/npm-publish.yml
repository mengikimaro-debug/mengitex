# Manual CI verification build for MengiTex Android APK

name: MengiTex CI Build Check

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & Install API 36.1
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Accept Android SDK licenses & verify platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36.1" "platform-tools" "build-tools;36.0.0" || true
          sdkmanager --install "build-tools;36.1.0" || true

      - name: Prepare valid signing keystore & environment
        run: |
          rm -f debug.keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -di debug.keystore.base64 > debug.keystore || true
          fi
          if ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            rm -f debug.keystore
            echo "" | base64 -di > debug.keystore
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:"
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build MengiTex Debug APK
        run: |
          gradle assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4500m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            --console=plain

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MengiTex-CI-APK
          path: app/build/outputs/apk/debug/*.apk
